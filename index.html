                { codigo: 'co', nombre: 'COL' }, { codigo: 'uy', nombre: 'URU' }, { codigo: 'ni', nombre: 'NIC' },
                { codigo: 'it', nombre: 'ITA' }, { codigo: 'ar', nombre: 'ARG' }, { codigo: 'cr', nombre: 'CRI' },
                { codigo: 'py', nombre: 'PAR' }, { codigo: 'mx', nombre: 'MEX' }, { codigo: 'pe', nombre: 'PER' },
                { codigo: 'br', nombre: 'BRA' }
            ];
            const banderasHtml = paises.map(p => 
                `<img src="https://flagcdn.com/w320/${p.codigo}.png" alt="${p.nombre}" title="${p.nombre}">`
            ).join('');

            const textoParticipacion = artista.tipoObra.includes('obra') || artista.tipoObra === 'obras' 
                ? `Ha participado activamente como <strong>artista colaborador(a)</strong> en esta publicación internacional, con la siguiente ${artista.tipoObra === 'obra' ? 'obra' : 'obras'}:`
                : `Ha participado activamente como <strong>autor(a) colaborador(a)</strong> en esta publicación internacional, con el/la siguiente ${artista.tipoObra}:`;

            const tituloEdicion = edicion === '1' ? 'Edición N.º 1 · 2025' : 'Edición N.º 2 · 2026';
            const subtituloTema = edicion === '1' ? '“Libre (Explosión Creativa en América Latina)”' : '“Voces que Habitan el Territorio”';
            const fechaCertificado = edicion === '1' ? '22 de octubre de 2025' : '18 de febrero de 2026';

            return `
                <div class="certificado">
                    <div class="esquina esquina-tl"></div>
                    <div class="esquina esquina-tr"></div>
                    <div class="esquina esquina-bl"></div>
                    <div class="esquina esquina-br"></div>

                    <div class="info-superior">
                        <div class="fundacion-nombre">FUNDACIÓN ARTES MULTICAP</div>
                        <div class="fundacion-detalles">NIT: 31710778-0 · Matrícula No.: 1220672-2 – Cámara de Comercio de Cali</div>
                        <div class="datos-registro">
                            <span>ISSN: 3114-9871</span>
                            <span>DOI: ${artista.doi}</span>
                            <span>Cali, Colombia</span>
                        </div>
                    </div>

                    <div class="banderas-container">
                        <div class="banderas-paises">${banderasHtml}</div>
                    </div>

                    <div class="titulo-certificado">CERTIFICADO DE PARTICIPACIÓN</div>
                    <div class="subtitulo">${subtituloTema} · ${tituloEdicion}</div>

                    <div class="contenido">
                        <div class="label">La Fundación Artes Multicap certifica que:</div>
                        <div class="nombre-artista">${artista.nombre}</div>
                        <div class="documento">
                            <strong>${artista.documento}</strong> · <strong>País:</strong> ${artista.pais}
                        </div>
                        <div class="texto-participacion">${textoParticipacion}</div>
                        <div class="obra-doi">
                            <strong>${artista.obra}</strong><br>
                            <span style="font-family: monospace;">DOI: ${artista.doi}</span>
                        </div>
                    </div>
                   
                    <!-- FIRMA ELEGANTE -->
                    <div class="firma">
                        <div class="firma-imagen">
                            <img src="https://fontmeme.com/permalink/260222/80a14540.png" alt="Firma artística personalizada" style="height: 30px; width: auto; display: block; margin: 0 auto;">
                        </div>
                        <div class="linea-firma"></div>
                        <div class="nombre-firma">YOBANA OROZCO BENAVIDES</div>
                        <div class="cargo-firma">Representante Legal · Fundación Artes Multicap</div>
                        <div class="credenciales">
                            Gestora Cultural nacional e internacional · Registro Único de Agentes Culturales – MinCultura<br>
                            Agente Cultural inscrita en el Mapa IberCultura Viva – SEGIB (ID 670813)
                        </div>
                    </div>

                    <div class="footer">
                        En Colombia, a ${fechaCertificado} · Publicación oficial
                    </div>
                       
                    <div class="logos-inferiores">
                        <img src="https://i.postimg.cc/jjZ7mqJB/480702220-618041787505911-8280549859336367380-n.jpg" alt="Fundación Artes Multicap" class="logo-fundacion">
                        <img src="https://i.postimg.cc/4NjxHQ4y/Whats-App-Image-2025-06-27-at-9.jpg" alt="Revista Explorando Arte y Cultura" class="logo-revista">
                    </div>
                </div>
            `;
        }

        // ============================================================
        // FUNCIÓN PRINCIPAL - VERIFICAR Y BUSCAR
        // ============================================================

        function verificarYBuscar() {
            const edicion = document.getElementById('edicionSelect').value;
            const docInput = document.getElementById('documentoInput').value.trim().replace(/\s+/g, '');
            const codInput = document.getElementById('codigoInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            if (!edicion) {
                errorMsg.textContent = 'Por favor selecciona una edición.';
                errorMsg.style.display = 'block';
                return;
            }

            if (!docInput || !codInput) {
                errorMsg.textContent = 'Por favor ingresa tu documento y el código de verificación.';
                errorMsg.style.display = 'block';
                return;
            }

            // Seleccionar la base de datos según la edición
            let artistas = edicion === '1' ? artistasEdicion1 : artistasEdicion2;
            
            if (artistas.length === 0 && edicion === '1') {
                errorMsg.textContent = 'Próximamente disponible la Edición 1.';
                errorMsg.style.display = 'block';
                return;
            }
            
            const artista = artistas.find(a => a.doc.replace(/\s+/g, '') === docInput);
            
            if (!artista) {
                errorMsg.textContent = 'Documento no encontrado en esta edición.';
                errorMsg.style.display = 'block';
                return;
            }

            // Verificar código (últimos 4 dígitos del DOI)
            const ultimos4 = artista.doi.slice(-4);
            if (codInput !== ultimos4) {
                errorMsg.textContent = 'Código de verificación incorrecto.';
                errorMsg.style.display = 'block';
                return;
            }

            // Mostrar el certificado
            errorMsg.style.display = 'none';
            document.getElementById('loginScreen').style.display = 'none';
            
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.style.display = 'flex';
            
            const container = document.getElementById('certificadoContainer');
            container.style.display = 'block';
            container.innerHTML = generarHTMLCertificado(artista, edicion);
        }

        // ============================================================
        // FUNCIÓN VOLVER AL INICIO
        // ============================================================

        function volverAlInicio() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('certificadoContainer').innerHTML = '';
            document.getElementById('documentoInput').value = '';
            document.getElementById('codigoInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }

        // ============================================================
        // EVENTOS DE TECLADO
        // ============================================================

        document.getElementById('codigoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarYBuscar();
        });

        document.getElementById('documentoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarYBuscar();
        });
    </script>
</body>
</html>
